name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.CI_DEPLOY_RUNNER == 'paid' && 'ubuntu-latest' || 'omarchy-secrets' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The site is plain static files with a committed style.css (rebuilt by
      # `npm run build:css` when classes change), so "build" only stages the
      # published files; repo tooling (src/, package.json, .github/) stays out of the deploy.
      - name: Stage site files
        run: |
          mkdir dist
          cp -r index.html 404.html robots.txt sitemap.xml style.css _headers fonts dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=abmengine-com --branch=main

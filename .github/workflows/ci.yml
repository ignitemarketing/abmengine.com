# Static-site checks for abmengine.com.
#
# The job keeps the name `validate` because the branch ruleset on main requires
# a check with that context. Every check is its own step and runs even after an
# earlier one failed (`if: ${{ !cancelled() }}`); the last step names every
# failure. Checkout and Node setup stay fail-fast. .github/scripts/check-run-through.mjs fails the build if a check step
# loses that condition.

name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # npm 10 (Node 22 on the runner image) crashes resolving html-validate's
      # peer set ("Cannot read properties of null (reading 'edgesOut')"); npm 11 does not.
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Workflow steps run through failures
        id: run_through
        if: ${{ !cancelled() }}
        run: node .github/scripts/check-run-through.mjs .github/workflows/ci.yml

      - name: HTML validation
        id: html
        if: ${{ !cancelled() }}
        run: npx --yes html-validate@11.6.2 "**/*.html"

      - name: Internal links
        id: links
        if: ${{ !cancelled() }}
        # linkinator serves the tree on 127.0.0.1, so only skip other hosts.
        # /cdn-cgi/ paths are generated by the Cloudflare edge, never by this repo.
        run: npx --yes linkinator@8.0.3 . --recurse --skip '^https?://(?!127\.0\.0\.1|localhost)' --skip '/cdn-cgi/'

      - name: No localhost references
        id: localhost
        if: ${{ !cancelled() }}
        run: |
          if grep -rEn 'http://localhost|127\.0\.0\.1' --include=*.html --include=*.css --include=*.js .; then
            echo "::error::localhost reference found"
            exit 1
          fi

      - name: Summary
        if: ${{ always() }}
        env:
          RUN_THROUGH: ${{ steps.run_through.outcome }}
          HTML: ${{ steps.html.outcome }}
          LINKS: ${{ steps.links.outcome }}
          LOCALHOST: ${{ steps.localhost.outcome }}
        run: |
          failed=""
          for pair in "run-through:$RUN_THROUGH" "html-validate:$HTML" "links:$LINKS" "localhost:$LOCALHOST"; do
            echo "$pair"
            case "$pair" in *:success) ;; *) failed="$failed ${pair%%:*}" ;; esac
          done
          if [ -n "$failed" ]; then
            echo "::error::failed checks:$failed"
            exit 1
          fi
